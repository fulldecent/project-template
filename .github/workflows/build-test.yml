# Build and test
#
# This runs: automatic builds, SLSA attestation and tests on each push; and immutable releases connected to builds.
#
# Update the build and test steps below for your own project.
#
# This workflow produces the following things which release.yml consumes:
#   1. $.jobs.build-test (this exact job ID)
#   2. build artifact name (in actions/upload-artifact step)

name: Build and test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v4

      - name: Build
        run: |
          # Replace this with the real build. Keep the output in dist/.
          mkdir -p dist
          cp README.md dist/

      - name: Test
        run: |
          # Replace this with the real test command.
          test -s dist/README.md

      - name: Attest the build
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 14
